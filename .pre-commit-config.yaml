repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^(node_modules/|docs/|dags/spark/yamls/)
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(.astro/|plugin/|.github/|data/|htmlcov|tests/fixtures/)
      - id: pretty-format-json
        args: ["--autofix"]
        exclude: "(Pipfile.lock|\\.ipynb$)"
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # Limpa outputs pesados de notebooks antes do commit.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  # Ferramenta única: ruff faz lint, import-sort (isort), pyupgrade, flake8
  # e formatação equivalente ao black. Substitui black/isort/flake8/pyupgrade/
  # reorder-python-imports que estavam duplicando trabalho.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(?!docs/).*\.(py|ipy)$
      - id: ruff-format
        files: ^(?!docs/).*\.(py|ipy)$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [--config-file=mypy.ini]
        exclude: ^(.github/|htmlcov)
        additional_dependencies:
          [beartype, pandas-stubs, types-markdown, types-requests, types-pyyaml]
        files: ^(?!docs/).*\.(py|ipy)$

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
