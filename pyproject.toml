[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experionml"
version = "1.5.0"
description = "A Python package for fast exploration of machine learning pipelines"
authors = [{name = "gersonrs", email = "gersonrodriguessantos8@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["Python package", "Machine Learning", "Modeling", "Data Pipeline"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
dependencies = [
    "beartype>=0.18.5",
    "category-encoders>=2.6.3",
    # woodwork<=0.31.0 (versão máxima disponível) ainda usa pkg_resources;
    # setuptools<70 é necessário para que pkg_resources exista como módulo de nível superior.
    "setuptools<70",
    "dill>=0.3.6",
    "featuretools>=1.28.0",
    "gplearn>=0.4.2",
    "imbalanced-learn>=0.12.3",
    "ipython>=8.9.0",
    "ipywidgets>=8.1.1",
    "joblib>=1.3.1",
    "nbformat>=4.2.0",
    "matplotlib>=3.7.2",
    "mlflow>=2.10.2",
    "nltk>=3.8.1",
    "numpy>=1.26.0",  # 1.26 é a bridge release para numpy 2.x (mesma API)
    "optuna>=3.6.0",
    # pandas <3.0: pandas 3 muda CoW para default e remove APIs deprecadas.
    # Remover pin após auditar chamadas a .values, inplace=, etc.
    "pandas>=2.2.2,<3.0",
    "plotly>=5.18.0",
    # sklearn <1.6: metadata routing vira default em 1.6; habilitar após
    # validar todos os transformadores personalizados com enable_metadata_routing=True.
    "scikit-learn>=1.5.0,<1.6",
    "scipy>=1.10.1",
    "shap>=0.43.0",
    "sktime[forecasting]>=0.30.0",
    "statsmodels>=0.14.1",
    # zoofs: 0.1.25 é a versão máxima no conda; manter para compatibilidade
    # com ambientes conda. Reavaliar ao publicar no conda-forge.
    "zoofs>=0.1.25",
]

[project.optional-dependencies]
full = [
    "botorch>=0.8.5; python_version < '3.12'",
    "catboost>=1.2",
    "dagshub>=0.3.8",
    "dask[dataframe,distributed]>=2024.2.0",
    "explainerdashboard>=0.4.3",
    # gradio: >=4.0 tem API incompatível com 3.x; actualizar o wrapper
    # em api.py antes de remover este pin.
    "gradio>=3.44.4,<4.0",
    "lightgbm>=4.1.0",
    "modin[ray]>=0.25.0; python_version < '3.12'",
    "optuna-integration>=3.6.0",
    # polars 1.0 renomeou vários métodos; manter >=1.0 para ter API estável.
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pyspark>=3.5.0",
    "ray[serve]>=2.9.1; python_version < '3.12'",
    "requests>=2.31.0",
    "scikit-learn-intelex>=2023.2.1; platform_system != 'Darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "schemdraw>=0.16",
    "statsforecast>=1.7.3",
    "supersmoother>=0.4",  # Required by MSTL (within statsforecast)
    "sweetviz>=2.3.1",
    "wordcloud>=1.9.2",
    "xgboost>=2.0.0",
]

# PEP 735 — dependency-groups são portáteis (pip install --group, uv, hatch).
# Substitui o antigo [tool.pdm.dev-dependencies], que só o PDM lia.
[dependency-groups]
lint = [
    "pre-commit>=3.6.2",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pandas-stubs",
    "types-markdown",
    "types-requests",
    "types-pyyaml",
]
test = [
    "absl-py>=2.1.0; python_version < '3.12'",  # Required by tensorflow
    "nbmake>=1.5.3",  # To test example notebooks
    "pytest>=8.1.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "scikeras>=0.13.0; python_version < '3.12'",
    "tensorflow>=2.16.2; python_version < '3.12'",
]
doc = [
    "jupyter-contrib-nbextensions>=0.7.0",
    "kaleido==1.3.0",  # For plotly static image export (v0.2.1.post1 is corrupted)
    "mike>=2.0.0",  # For versioning
    "mkdocs>=1.5.3",
    "mkdocs-autorefs>=1.0.1",
    "mkdocs-git-revision-date-localized-plugin>=1.2.4",
    "mkdocs-jupyter>=0.24.6",
    "mkdocs-material>=9.5.13",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-simple-hooks>=0.1.5",
    "mkdocstrings[python]>=0.25.0",
    "notebook==6.4.12",  # Older versions fail with plugins
    "pymdown-extensions>=10.7.1",
    "pyyaml>=6.0.1",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "doc"},
]

[project.urls]
"Repository" = "https://github.com/gersonrs/ExperionML"
"Bug Tracker" = "https://github.com/gersonrs/ExperionML/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["experionml*"]

[tool.setuptools.package-data]
experionml = ["py.typed"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = "tests/"
python_files = "*.py"
python_functions = "test_*"

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 99
indent-width = 4
show-fixes = true
extend-include = ["*.ipynb"]
extend-exclude = ["examples/"]

[tool.ruff.lint]
select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "D",  # Missing docstring in public function
    "UP",  # pyupgrade
    "YTT",  # flake8-2020
    "BLE",  # blind-except
    "FBT",  # boolean-trap
    "B",  # bugbear
    "A",  # builtins
    "COM",  # commas
    "C4",  # flake8-comprehensions
    "T10",  # debugger
    "ISC",  # implici-str-concat
    "ICN",  # import-conventions
    "G",  # flake8-logging-format
    "INP",  # no-pep420
    "PIE",  # flake8-pie
    "T20",  # print
    "PYI",  # pyi
    "PT",  # flake8-pytest-style
    "Q",  # quotes
    "RSE",  # raise
    "TID",  # tidy-imports
    "ARG",  # flake8-unused-arguments
    "ERA",  # commented-code
    "PD",  # pandas-vet
    "PGH",  # pygrep
    "FLY",  # flynt
    "NPY",  # numpy-specific-rules
    "PERF",  # performance checks
    "RUF",  # ruff
]
ignore = [
    "E731",  # Do not assign a `lambda` expression, use a `def`
    "E501",  # Line too long (gerenciado pelo formatter)
    "COM812",  # Trailing comma missing (conflita com formatter)
    "ISC001",  # Implicit string concatenation (conflita com formatter)
    "PD011",  # Use `.to_numpy()` instead of `.values`
    "PD009",  # Use `.iloc` instead of `.iat`
    "ARG002",  # Unused method argument
    "B023",  # Function definition does not bind loop variable
    "D100",  # Missing docstring in public module (ruído; docstrings relevantes estão nas funções)
    "D104",  # Missing docstring in public package
    "D401",  # First line should be in imperative mood (estilo; existem docstrings em PT que não batem)
    "PYI061",  # Use `X | None` instead of `Optional[X]` em .pyi
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports
"baserunner.py" = ["ERA001"]  # Commented-out code
"types.py" = [
    "D105",  # Missing docstring in magic method
    "D102",  # Missing docstring in public method
]
"tests/*" = [
    "T20",  # print found
    "S101",  # assert called
    "PT011",  # error is too broad
    "RUF043",  # regex com metacaracteres em `match=` — ok em testes
    "RUF059",  # unused unpacked variable — comum em fixtures
    "RUF061",  # legacy pytest.raises form
    "PT001",  # pytest fixture parentheses style
]
"autodocs.py" = [
    "C408",  # Unnecessary `dict` call
    "ARG001",  # Unused function argument
]
"autorun.py" = [
    "A002",  #  Argument is shadowing a Python builtin
    "BLE001",  # Bare except
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
cache_dir = ".cache/mypy"
ignore_missing_imports = true
disable_error_code = [
    "attr-defined",
    "abstract",  # See https://github.com/python/mypy/issues/4717
    "override",  # Transformers' methods don't always match with that of TransformerMixin
    "misc",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
