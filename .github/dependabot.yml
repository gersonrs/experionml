version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # setuptools pinned <70 por compat. com featuretools/woodwork —
      # remover quando featuretools migrar de pkg_resources.
      - dependency-name: "setuptools"
      # sklearn <1.6 pinado por compat. com experionml — reavaliar
      # ao eliminar o pin.
      - dependency-name: "scikit-learn"
